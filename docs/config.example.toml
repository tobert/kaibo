# kaibo configuration. Copy only the sections you need.
# Default file: $XDG_CONFIG_HOME/kaibo/config.toml, else ~/.config/kaibo/config.toml.
# Override with --config FILE or KAIBO_CONFIG. All settings are optional.
# Precedence: per-call > CLI > KAIBO_* env > file > built-in.
# Reference: kaibo://config/guide or `kaibo config-guide`.
# Codex access and consent: kaibo://config/codex or `kaibo config-guide codex`.
# Resolved settings: kaibo://config or `kaibo config`.

[server]
# Omit root to use launch cwd. Paths in config expand ~, $VAR, and ${VAR}.
# root = "~/src/project"
# allow_paths = ["~/shared/fixtures"] # additional trees; CLI --allow-path repeats
# infer_cwd = true                  # false disables cwd inference (--no-cwd)
# follow_worktrees = true           # follows linked worktrees of allowed repos
cast = "anthropic"
log = "kaibo=info"                  # RUST_LOG wins

# Tools also need a usable cast. Full table: kaibo://config/guide, "Tool gating".
[server.tools]
consult = true                     # includes consult_submit
explore = true
deliberate = true                   # requires explorer + offline synth
oneshot = true
run_kaish = true
batch = true                       # batch_submit; requires batch synth
list_models = true
generate = true                     # requires image slot + CAS
# job_* tools follow enabled producers; read_cas/write_cas follow cas.enabled.

[defaults]
explorer_max_turns = 100            # per survey; final answer turn follows the cap
synth_max_turns = 200               # per consult driver
max_tokens = 16384                  # includes reasoning; check provider output limits
thinking_budget = 8192              # budget-tier models need max_tokens > this
explorer_temperature = 0.1          # [0, 2]; omitted where thinking forbids sampling
synth_temperature = 0.3
top_p = 0.95                        # (0, 1]
explorer_effort = "high"            # model-dependent; prefer slot overrides
synth_effort = "high"
thinking_style = "auto"            # auto | adaptive | budget | off
request_timeout_secs = 900          # each request; backend can override; > 0
call_deadline_secs = 3600           # whole interactive call, including retries; > 0
session_capacity = 128              # memory LRU; > 0
job_capacity = 64                   # memory LRU; evicting a running job aborts it
inline_attach_budget = 262144       # consult text bytes inlined; 0 routes all to reads
max_attachments = 32                # files routed per survey; 0 disables attach

[orientation]
enabled = true
full_list_max_files = 256           # larger repos get a directory map; > 0
tree_max_depth = 4                  # directory map depth; > 0

[persistence]
enabled = true                     # false gives in-memory sessions
# path = "~/.local/state/kaibo/state.db" # default uses XDG_STATE_HOME when set
# --state-db / KAIBO_STATE_DB override path. Keep state outside allowed project trees.

[sandbox]
exec_timeout_secs = 30              # kaish script deadline; exit 124
output_limit_bytes = 65536          # exit 3 returns a head/tail sample
scratch_limit_bytes = 67108864      # in-memory root scratch; > 0
# disable_builtins = ["grep"]       # extra restrictions only; file-only

# Ignore policy applies inside the read-only shell.
# [kaish.ignore]
# files = [".gitignore"]            # replaces the list; [] disables explicit files
# defaults = true                   # built-in exclusions such as .git and target
# auto_gitignore = true             # nested .gitignore files
# global_gitignore = false          # user's git excludesFile
# scope = "enforced"                # enforced | advisory

# Optional OTLP/HTTP export. Ambient OTEL_* endpoints can enable it too.
# Explicit enabled=false or OTEL_SDK_DISABLED disables export.
# [telemetry]
# enabled = true
# endpoint = "http://localhost:4318/v1/traces"
# traces = true
# logs = true
# metrics = true
# logs_endpoint = "http://localhost:4318/v1/logs"       # default derived from endpoint
# metrics_endpoint = "http://localhost:4318/v1/metrics" # default derived from endpoint
# timeout_secs = 10                 # > 0
# service_name = "kaibo"
# capture_content = false           # true exports prompts, responses, tool content
# capture = ["gen_ai.output.messages"] # admit individual content attributes
# headers = { authorization = "Bearer <token>" } # values are secrets; file-only

# Artifact store: disk with persistence, otherwise memory; keep outside project trees.
# [cas]
# enabled = true
# dir = "~/.local/share/kaibo/cas"   # default uses XDG_DATA_HOME when set
# max_bytes = 8589934592            # optional 8 GiB soft cap; omit for no cap
# A cap requires a store walk on each write. Full means refuse, never evict.

# Permit consult's model to save text. Caller must also set save_artifacts=true.
# [artifacts]
# enabled = false                   # default; --allow-save-artifact enables in serve

# Credentials: declare sources explicitly; built-ins assume none.
# env wins over file OR command. api_key_file and api_key_cmd are mutually exclusive.
# Key values stay in the environment, file, or vault. Clients resolve fresh per role.
# MCP config/environment changes need a server restart; rotated files do not.
# [backends.anthropic]
# api_key_env = "ANTHROPIC_API_KEY"
# api_key_file = "~/.anthropic-key.txt"
# Alternative to api_key_file:
# api_key_cmd = ["op", "read", "op://Vault/Kaibo/Anthropic-key"]
# Commands use argv, no shell; stdin closed; 30-second limit; output never logged.

# [backends.deepseek]
# api_key_file = "~/.deepseek-key"
# [backends.gemini]
# api_key_env = "GEMINI_API_KEY"
# [backends.openrouter]
# api_key_env = "OPENROUTER_API_KEY"
# data_collection = "deny"          # default; allow defers to account routing policy

# A backend is a named connection; kind is required on new backends.
# Hosted OpenAI uses Responses by default; other openai endpoints use Chat Completions.
[backends.gpt]
kind = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
key_optional = false
aliases = ["oai"]

[backends.llama]
kind = "openai"
base_url = "http://localhost:8080/v1"
key_optional = true                 # missing source uses a placeholder; broken source fails
request_timeout_secs = 1800

# A gateway that implements Responses must opt into that wire.
[backends.gateway]
kind = "openai"
base_url = "https://llm-gateway.example.internal/v1"
api_key_env = "GATEWAY_API_KEY"
wire = "responses"                 # responses | chat; interactive only

[backends.vault-keyed]
kind = "deepseek"
api_key_cmd = ["op", "read", "op://Vault/Kaibo/Deepseek-key"]

# Cast examples. Usually start with a built-in family; mix backends when useful.
# String slots split at the first slash. Table slots accept per-model tunables.
[casts.chimera]
explorer = "deepseek/deepseek-flash"
synth = "claude/claude-sonnet-4-6"

[casts.local-only]
explorer = "gemma/Gemma-4-E4B-it-GGUF"
synth = "gemma/Gemma-4-26B-A4B-it-GGUF"

# Pin vision on generic endpoints when the actual model accepts image input.
[casts.vlm]
explorer = "llama/qwen2.5-coder-7b"
synth = { backend = "llama", id = "qwen2.5-vl-32b", vision = true }

[casts.deep-dive]
aliases = ["deep"]
explorer = { backend = "deepseek", id = "deepseek-flash", temperature = 0.0, thinking_budget = 4096, thinking_style = "auto" }
synth = { backend = "claude", id = "claude-opus-4-8", effort = "max", max_tokens = 32768 }

[casts.or-deep]
explorer = "openrouter/~google/gemini-flash-latest"
synth = { backend = "openrouter", id = "~anthropic/claude-sonnet-latest", effort = "xhigh" }

# Slot preamble > [prompts].phase > built-in; one synth slot can serve several phases.
[casts.tuned-local]
explorer = { backend = "gemma", id = "Gemma-4-E4B-it-GGUF", preamble = "You are a careful reader. Cite exact numbered lines." }
synth = "claude/claude-sonnet-4-6"

[casts.gpt]
explorer = { backend = "gpt", id = "gpt-5.6-luna", vision = true, effort = "low" }
synth = { backend = "gpt", id = "gpt-5.6-sol", vision = true, effort = "high" }

[casts.gpt-balanced]
explorer = { backend = "gpt", id = "gpt-5.6-luna", vision = true, effort = "low" }
synth = { backend = "gpt", id = "gpt-5.6-terra", vision = true, effort = "medium" }

# Batch-only casts need a synth; deliberate needs an interactive explorer beside it.
[casts.pro-batch]
batch = true                       # legacy sugar for synth lane="batch"
synth = "gemini/gemini-pro-latest"

[casts.gpt-batch]
synth = { backend = "gpt", id = "gpt-5.6-sol", lane = "batch" }

[casts.gpt-deliberate]
explorer = { backend = "gpt", id = "gpt-5.6-luna", vision = true, effort = "low" }
synth = { backend = "gpt", id = "gpt-5.6-sol", lane = "batch" }

[casts.fable]
explorer = "anthropic/claude-sonnet-4-6"
synth = { backend = "anthropic", id = "claude-fable-5", lane = "batch" }

[casts.gemini-deliberate]
explorer = "gemini/gemini-flash-lite-latest"
synth = { backend = "gemini", id = "gemini-pro-latest", lane = "batch" }

# Direct is one long completion, with no provider batch API.
[casts.local-direct]
explorer = "gemma/Gemma-4-E4B-it-GGUF"
synth = { backend = "gemma", id = "Big-Local-70B-GGUF", lane = "direct" }

